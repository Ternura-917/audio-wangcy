<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To 王涔宇</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #fff7f0;
      color: #333;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.7;
    }
    h1 { text-align: center; }
    .item {
      background: #fff;
      border-radius: 14px;
      padding: 16px 18px;
      margin: 18px 0;
      box-shadow: 0 4px 14px rgba(0,0,0,.06);
    }
    .item h2 { margin: 0 0 8px; font-size: 18px; }
    audio { width: 100%; }
    footer { text-align: center; color: #999; margin-top: 30px; font-size: 14px; }
  </style>
</head>
<script>
  var pwd = prompt("请输入密码：");
  if (pwd !== "20261006") {
    document.body.innerHTML = "<h1 style='text-align:center;margin-top:50px;'>密码错误 🔒</h1>";
    throw new Error("Access denied");
  }
</script>
<body>
  <h1>🎁 美妙音乐分享</h1>
  <p style="text-align:center;">这个页面可能会增加声音。</p>

  <div class="item">
    <h2>🎂 2026 生日祝福</h2>
    <audio controls src="song1.mp3"></audio>
  </div>
  
   <div class="item">
    <h2>🎂 2026 生日祝福</h2>
    <audio controls src="song2.mp3"></audio>
  </div>
  <footer>扫码纯享 ↓</footer>
</body>
</html>
